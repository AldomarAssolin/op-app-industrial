name: Setup Django e PostgreSQL

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Valores descartáveis, exclusivos do runner de CI.
      DJANGO_SECRET_KEY: ci-only-disposable-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      POSTGRES_DB: op_app_ci
      POSTGRES_USER: op_app_ci
      POSTGRES_PASSWORD: ci-only-disposable-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5433"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Validar protecoes da rotina de backup sem servicos reais
        run: python -m unittest ops.test_backup -v
      - name: Validar Compose e iniciar PostgreSQL 17
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 90 db
      - name: Validar configuração, migrações e testes
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py configurar_perfis
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --check
          python manage.py collectstatic --noinput
          python manage.py test -v 2 --noinput
      - name: Diagnóstico do banco em caso de falha
        if: failure()
        run: docker compose logs db
      - name: Validar imagem do piloto sem acesso ao banco
        run: |
          docker build -t op-app:ci .
          docker run -d --name op-app-smoke -p 127.0.0.1:18000:8000 \
            -e DJANGO_SECRET_KEY=ci-only-disposable-key-for-container-smoke-not-for-production \
            -e DJANGO_DEBUG=False -e DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost \
            -e OP_APP_PRODUCT_HOME_ENABLED=True \
            -e OP_APP_PUBLIC_PAGES_ENABLED=True -e OP_APP_SUPPORT_EMAIL=ci@example.com \
            -e POSTGRES_DB=unused -e POSTGRES_USER=unused -e POSTGRES_PASSWORD=unused \
            -e DB_HOST=127.0.0.1 -e DB_PORT=9 op-app:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health/; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/health/
          curl --fail --silent http://127.0.0.1:18000/ > /tmp/op-app-public-home.html
          python -c "from pathlib import Path; assert 'EXEMPLO FICTÍCIO' in Path('/tmp/op-app-public-home.html').read_text()"
          curl --fail --silent http://127.0.0.1:18000/integracoes/backup/ > /dev/null
          curl --fail --silent http://127.0.0.1:18000/privacidade/ > /dev/null
          curl --fail --silent http://127.0.0.1:18000/conta/entrar/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/app/)" = 302
          curl --fail --silent http://127.0.0.1:18000/admin/login/ > /dev/null
          curl --fail --silent http://127.0.0.1:18000/static/admin/css/base.css > /dev/null
          curl --fail --silent http://127.0.0.1:18000/static/planejamento/css/admin.css > /dev/null
          curl --fail --silent http://127.0.0.1:18000/static/planejamento/css/orientacao.css > /dev/null
          test "$(docker exec op-app-smoke id -u)" != 0
      - name: Encerrar contêiner de validação
        if: always()
        run: docker rm -f op-app-smoke || true
      - name: Encerrar banco descartável do CI
        if: always()
        run: docker compose down -v
